plugin {
    dynamic-cursors {
        enabled = true
        mode    = stretch

        stretch {
            limit    = 3000
            function = quadratic
            window   = 100
        }

        shake {
            enabled   = true
            threshold = 4.0
        }

        hyprcursor {
            enabled    = true
            nearest    = true
            resolution = -1
            fallback   = clientside
        }
    }
}
